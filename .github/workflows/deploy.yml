# .github/workflows/deploy.yml
# ─────────────────────────────────────────────────────────────
# CONCEPT: CI/CD with GitHub Actions
#
# CI = Continuous Integration: run tests automatically on every
#   push so you catch bugs before they reach production.
#
# CD = Continuous Deployment: automatically deploy to production
#   when tests pass on the main branch.
#
# HOW THIS WORKFLOW WORKS:
#   1. You push code to GitHub (git push origin main)
#   2. GitHub Actions automatically triggers this file
#   3. The "test" job: installs deps, runs type-check + lint
#   4. If tests pass, the "deploy-frontend" job triggers Vercel
#   5. Simultaneously, "deploy-backend" triggers Laravel Forge
#   6. Both run in parallel — total deploy time ~2-3 minutes
#
# SECRETS (set in GitHub → repo Settings → Secrets):
#   VERCEL_TOKEN        — Vercel API token
#   VERCEL_ORG_ID       — Your Vercel organization ID
#   VERCEL_PROJECT_ID   — Your Vercel project ID
#   FORGE_SERVER_ID     — Laravel Forge server ID
#   FORGE_SITE_ID       — Laravel Forge site ID
#   FORGE_API_TOKEN     — Laravel Forge API token
# ─────────────────────────────────────────────────────────────

name: Deploy KNL Atelier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Test & type-check the frontend ─────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./knl-atelier-phase1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: knl-atelier-phase1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (validates no build errors)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL:                 ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL:                https://knlatelier.com
          NEXT_PUBLIC_GA_MEASUREMENT_ID:       ${{ secrets.GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_FB_PIXEL_ID:             ${{ secrets.FB_PIXEL_ID }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:   ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}

  # ── Job 2: Deploy frontend to Vercel ──────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: test-frontend           # Only runs if tests pass
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:      ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:     ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./knl-atelier-phase1
          vercel-args:       "--prod"

  # ── Job 3: Deploy backend via Laravel Forge ───────────────
  deploy-backend:
    name: Deploy Backend → Forge
    needs: test-frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Forge deployment
        # Forge has a "deploy script" feature. Hitting this webhook
        # URL tells Forge to: git pull + composer install +
        # php artisan migrate --force + php artisan config:cache +
        # php artisan queue:restart
        run: |
          curl --silent --show-error --fail \
            -X POST \
            "https://forge.laravel.com/servers/${{ secrets.FORGE_SERVER_ID }}/sites/${{ secrets.FORGE_SITE_ID }}/deploy/http?token=${{ secrets.FORGE_API_TOKEN }}"

      - name: Wait for deployment and verify health
        run: |
          echo "Waiting 30s for deployment to complete..."
          sleep 30
          # Hit the /up health check endpoint (built into Laravel 11+)
          curl --fail --silent "${{ secrets.API_URL }}/up" || exit 1
          echo "✅ API health check passed"

  # ── Job 4: Notify on failure ──────────────────────────────
  notify-failure:
    name: Notify on Failure
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Create GitHub issue on deploy failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner:   context.repo.owner,
              repo:    context.repo.repo,
              title:   `🚨 Deploy failed on ${context.sha.slice(0, 7)}`,
              body:    `Deployment failed. Check the [Actions log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\nTriggered by: @${context.actor}`,
              labels:  ['bug', 'deployment'],
            });
